<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090f14">
  <title>Soraine | Combustion Observatory</title>
  <meta name="description" content="Explore NASA combustion research across Earth, microgravity, Moon and Mars. Compare reported material limits and trace every result to its source.">
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#workspace">Skip to research</a>
  <header class="topbar">
    <a class="brand" href="#overview" aria-label="Soraine overview"><img src="./assets/mark.svg" alt="" width="37" height="37"><span>SORAINE<small>FLAME IN FREEFALL</small></span></a>
    <nav class="main-nav" aria-label="Research views">
      <button data-view="overview" class="active">Overview</button><button data-view="compare">Compare</button><button data-view="evidence">Evidence</button><button data-view="sources">Sources</button>
    </nav>
    <div class="header-actions"><span class="connection"><i></i> BigQuery snapshot</span><button class="icon-btn" id="about-btn" aria-label="About this data and credits" title="About this data"><span data-icon="info"></span></button><button class="export-btn" id="export-all"><span data-icon="download"></span><span>Export data</span></button></div>
  </header>
  <aside class="rail" aria-label="Workspace shortcuts"><button class="rail-logo" data-view="overview" aria-label="Observatory" title="Observatory"><span data-icon="orbit"></span></button><div class="rail-line"></div><button data-view="overview" class="active" aria-label="Overview" title="Overview"><span data-icon="grid"></span></button><button data-view="compare" aria-label="Compare materials" title="Compare materials"><span data-icon="chart"></span></button><button data-view="evidence" aria-label="Evidence records" title="Evidence records"><span data-icon="layers"></span></button><button data-view="sources" aria-label="Source library" title="Source library"><span data-icon="book"></span></button><div class="rail-bottom"><span class="team-avatar">S</span><span class="rail-word">TEAM</span></div></aside>
  <main id="workspace" tabindex="-1">
    <div class="workspace-heading"><div><div class="eyebrow">RESEARCH WORKSPACE <span>/</span> NASA SPACE APPS 2026</div><h1>Combustion observatory<span class="beta-tag">RESEARCH</span></h1></div><label class="global-search"><span data-icon="search"></span><input id="global-search" placeholder="Find a material, result or source" aria-label="Search all research"><kbd>/</kbd></label></div>
    <div id="view" aria-live="polite"><div class="loading-state"><span class="loading-orbit"></span>Loading the research archive…</div></div>
    <footer><span><i class="status-dot"></i> TEAM SORAINE <span class="footer-divider">/</span> NASA combustion evidence</span><span id="snapshot-date">Reading snapshot…</span><button id="credits-btn">Data & credits <span aria-hidden="true">↗</span></button></footer>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><button class="dialog-close icon-btn" aria-label="Close details">×</button><div id="detail-content"></div></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
