[package]
name = "soraine-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser (WebAssembly) entry point for Soraine. Exposes soraine-core to the page."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soraine-core = { path = "../soraine-core" }
serde_json = "1"
wasm-bindgen = "=0.2.130"
